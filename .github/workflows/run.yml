name: X Views (Browser)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYWRIGHT_VERSION: "1.63.0"

concurrency:
  group: x-views-browser
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py

      - name: Upload debug screenshots
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state"
          git pull --rebase
          git push
