name: X Jnoub Views - Manual Link Retry
run-name: X Jnoub Views retry (${{ inputs.link }})

on:
  workflow_dispatch:
    inputs:
      link:
        description: "رابط منشور X محدد لإعادة المحاولة"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x-jnoub-views
  cancel-in-progress: false

jobs:
  retry-one-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependency
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Retry selected X link
        env:
          SITE_USERNAME_1: ${{ secrets.SITE_USERNAME_1 }}
          SITE_PASSWORD_1: ${{ secrets.SITE_PASSWORD_1 }}
          SITE_USERNAME_2: ${{ secrets.SITE_USERNAME_2 }}
          SITE_PASSWORD_2: ${{ secrets.SITE_PASSWORD_2 }}
          SITE_USERNAME_3: ${{ secrets.SITE_USERNAME_3 }}
          SITE_PASSWORD_3: ${{ secrets.SITE_PASSWORD_3 }}
          API_KEY: ${{ secrets.API_KEY }}
          TARGET_LINK: ${{ inputs.link }}
        run: python retry_link.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state after manual X retry"
          git pull --rebase origin main
          git push origin HEAD:main
